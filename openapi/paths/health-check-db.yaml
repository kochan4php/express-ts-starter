get:
  summary: Database Health check endpoint
  tags:
    - Health
  responses:
    '200':
      description: Database is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Database is healthy"
              data:
                type: object
                properties:
                  dbHealthy:
                    type: boolean
                    example: true
                  timestamp:
                    type: number
                    example: 1785600452901
    '503':
      description: Database is unhealthy
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Database is unhealthy"
              error:
                type: object
                properties:
                  dbHealthy:
                    type: boolean
                    example: false
                  timestamp:
                    type: number
                    example: 1785600452901
