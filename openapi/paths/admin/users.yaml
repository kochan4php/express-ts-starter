get:
  summary: Get all users
  tags:
    - Admin
  security:
    - bearerAuth: []
  responses:
    '200':
      description: List of users
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Get all users success"
              data:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '../../components/schemas/User.yaml'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
post:
  summary: Create a user
  tags:
    - Admin
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
            - phoneNumber
          properties:
            name:
              type: string
              example: "Jane Doe"
            email:
              type: string
              example: "jane@example.com"
            password:
              type: string
              example: "secure123"
            phoneNumber:
              type: string
              example: "0987654321"
  responses:
    '201':
      description: User created
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Create user success"
              data:
                type: object
                properties:
                  user:
                    $ref: '../../components/schemas/User.yaml'
