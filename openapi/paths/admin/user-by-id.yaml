get:
  summary: Get user by ID
  tags:
    - Admin
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      example: "68c1869b-dac1-4822-b5fe-365618ed4914"
  responses:
    '200':
      description: User data
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Get user success"
              data:
                type: object
                properties:
                  user:
                    $ref: '../../components/schemas/User.yaml'
put:
  summary: Update user
  tags:
    - Admin
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      example: "68c1869b-dac1-4822-b5fe-365618ed4914"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Update user success"
              data:
                type: object
                properties:
                  user:
                    $ref: '../../components/schemas/User.yaml'
delete:
  summary: Delete user
  tags:
    - Admin
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      example: "68c1869b-dac1-4822-b5fe-365618ed4914"
  responses:
    '200':
      description: User deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Delete user success"
