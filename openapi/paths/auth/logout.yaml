delete:
  summary: Logout user
  tags:
    - Auth
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Logout successful
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Logout success"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
