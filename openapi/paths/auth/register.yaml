post:
  summary: Register a new user
  tags:
    - Auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
            - phoneNumber
          properties:
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              format: email
              example: "john@example.com"
            password:
              type: string
              format: password
              example: "secret123"
            phoneNumber:
              type: string
              example: "1234567890"
  responses:
    '201':
      description: User registered successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Register success"
              data:
                type: object
                properties:
                  user:
                    $ref: '../../components/schemas/User.yaml'
    '400':
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
