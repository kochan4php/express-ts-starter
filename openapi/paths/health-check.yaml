get:
  summary: Health check endpoint
  tags:
    - Health
  responses:
    '200':
      description: Server is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Health check success"
              data:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"
                  uptime:
                    type: number
                    example: 230.3073
                  timestamp:
                    type: number
                    example: 1785600452901
