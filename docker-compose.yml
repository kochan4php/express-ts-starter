version: '3.8'

services:
    server-app:
        container_name: server-app
        build:
            context: .
            dockerfile: ./dockerfiles/production/Dockerfile
        image: express_ts_starter:latest
        restart: always
        ports:
            - 8000:8000
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-f',
                    'http://localhost:8000/api/health-check'
                ]
            interval: 30s
            timeout: 30s
            retries: 5
            start_period: 5s
        env_file: ./env/.env.production.local
        environment:
            PORT: 8000
            DATABASE_URL: postgresql://dev:dev@postgres:5432/expressts
            ACCESS_TOKEN_SECRET: das9807asd908a90d8sa09d323
            REFRESH_TOKEN_SECRET: c9sddc8s90cuscuj90ew8r09w3
            SESSION_TOKEN_SECRET: das90d8sad7sa8d7as89d7asdsad
            # TRUSTED_DOMAINS: http://localhost:4000
        networks:
            - express-ts-starter-network
        depends_on:
            - postgres
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M

    postgres:
        container_name: postgres
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: expressts
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - express-ts-starter-network
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M

networks:
    express-ts-starter-network:
        name: express-ts-starter-network
        driver: bridge

volumes:
    postgres-data:
        name: postgres-data
